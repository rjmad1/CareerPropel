name: Bug Report
description: Something is broken or behaving unexpectedly.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (data loss / security / production down)
        - High (core feature broken)
        - Medium (degraded experience)
        - Low (cosmetic / edge case)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Environment: production / staging / local
        - Browser/Node version:
        - Relevant env vars (no secrets):

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste structured log output or attach screenshots.

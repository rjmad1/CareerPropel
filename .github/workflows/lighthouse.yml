name: Lighthouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start server
        run: npm run start &
        timeout-minutes: 2

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json

      - name: Comment PR with Lighthouse Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('./dist/manifest.json', 'utf8'));
              const results = report.runs[0].scores;

              const comment = `
              ## ⚡ Lighthouse Report

              | Metric | Score |
              |--------|-------|
              | Performance | ${Math.round(results.performance * 100)} |
              | Accessibility | ${Math.round(results.accessibility * 100)} |
              | Best Practices | ${Math.round(results['best-practices'] * 100)} |
              | SEO | ${Math.round(results.seo * 100)} |

              ${results.performance < 0.9 ? '⚠️ Performance below 90%' : '✅ Performance targets met'}
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not parse Lighthouse results:', e);
            }

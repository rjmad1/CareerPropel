name: Lighthouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpropel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerpropel_ci
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      # NODE_ENV is intentionally absent at job level — npm ci omits
      # devDependencies when NODE_ENV=production, which breaks the build.
      # It is set per-step only where production mode is actually required.

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Setup database schema
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start server
        run: npm run start &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json

      - name: Comment PR with Lighthouse Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            try {
              const manifestPath = path.join('.lighthouseci', 'manifest.json');
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              const run = manifest[0];
              if (!run || !run.summary) {
                console.log('No Lighthouse summary found in manifest');
                return;
              }
              const s = run.summary;
              const pct = (v) => Math.round((v || 0) * 100);
              const icon = (v) => v >= 0.9 ? '✅' : v >= 0.75 ? '⚠️' : '❌';
              const row = (label, key) =>
                icon(s[key]) + ' **' + label + '**: ' + pct(s[key]) + '/100';
              const lines = [
                '## ⚡ Lighthouse Report',
                '',
                row('Performance', 'performance'),
                row('Accessibility', 'accessibility'),
                row('Best Practices', 'best-practices'),
                row('SEO', 'seo'),
                '',
                'URL: ' + run.url,
              ];
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: lines.join('\n'),
              });
            } catch (e) {
              console.log('Could not parse Lighthouse results:', e.message);
            }

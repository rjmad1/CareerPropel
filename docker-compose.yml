version: "3.9"

services:
  web:
    build: .
    command: npm run start:web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/careerpropel
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
      LOG_LEVEL: info
      LLM_PROVIDER: anthropic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: npm run start:worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/careerpropel
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
      LOG_LEVEL: info
      LLM_PROVIDER: anthropic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    command: npm run start:scheduler
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/careerpropel
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
      LOG_LEVEL: info
      LLM_PROVIDER: anthropic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careerpropel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerpropel"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

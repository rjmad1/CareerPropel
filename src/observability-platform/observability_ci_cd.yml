# GitHub Actions Workflow Template for AI Observability Console

name: AI Observability Console — CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/observability-platform/**'
      - 'src/app/observability/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/observability-platform/**'
      - 'src/app/observability/**'

jobs:
  validate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Eslint Verification
        run: npm run lint

      - name: Run TypeScript Compiler Check
        run: npm run type-check

      - name: Execute Component Unit Tests
        run: npm test

  security_scan:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Audit Vulnerable Dependencies
        run: npm audit --audit-level=high

      - name: Verify Secret Exposures
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  deploy_staging:
    name: Build & Push Docker image (Staging)
    needs: [validate, security_scan]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/observability-platform/Dockerfile.observability
          push: true
          tags: ghcr.io/${{ github.repository }}/observability-console:staging
